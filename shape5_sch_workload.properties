EquiJoin_Group_NumAgg_SpatialFilter_36%_SHAPE5=SELECT v.v_ship_type, COALESCE(AVG(tz.tz_avg_cog), -9999) AS avg_COG, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_SOG FROM DimVessel v, Trips t, TripZones_polygons5 tz WHERE v.v_mmsi = t.t_vessel AND tz.tz_zone_polygon && ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),2) AND ST_Intersects(ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),2), tz.tz_zone_polygon) AND t.t_trip_sk = tz.tz_trip_sk GROUP BY v.v_ship_type

#----BATCH 7
