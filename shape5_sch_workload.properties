#----SERIE EQUI JOIN
#----BATCH #6
EquiJoin_Group_NumAgg_NoFilter_100%_SHAPE5=SELECT v.v_ship_type, COALESCE(AVG(tz.tz_avg_cog), -9999) AS avg_COG, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_SOG FROM DimVessel v, Trips t, TripZones_polygons5 tz WHERE v.v_mmsi = t.t_vessel AND t.t_trip_sk = tz.tz_trip_sk GROUP BY v.v_ship_type
EquiJoin_Group_NumAgg_AlphaFilter_8%_SHAPE5=SELECT v.v_ship_type, COALESCE(AVG(tz.tz_avg_cog), -9999) AS avg_COG, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_SOG FROM DimVessel v, Trips t, TripZones_polygons5 tz WHERE v.v_mmsi = t.t_vessel AND t.t_trip_sk = tz.tz_trip_sk AND tz.tz_entrance_time <= 20000 AND tz.tz_quit_time >= 10100 GROUP BY v.v_ship_type
EquiJoin_Group_NumAgg_AlphaFilter_16%_SHAPE5=SELECT v.v_ship_type, COALESCE(AVG(tz.tz_avg_cog), -9999) AS avg_COG, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_SOG FROM DimVessel v, Trips t, TripZones_polygons5 tz WHERE v.v_mmsi = t.t_vessel AND t.t_trip_sk = tz.tz_trip_sk AND tz.tz_entrance_time <= 25000 AND tz.tz_quit_time >= 10100 GROUP BY v.v_ship_type
EquiJoin_Group_NumAgg_AlphaFilter_33%_SHAPE5=SELECT v.v_ship_type, COALESCE(AVG(tz.tz_avg_cog), -9999) AS avg_COG, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_SOG FROM DimVessel v, Trips t, TripZones_polygons5 tz WHERE v.v_mmsi = t.t_vessel AND t.t_trip_sk = tz.tz_trip_sk AND tz.tz_entrance_time <= 50000 AND tz.tz_quit_time >= 10100 GROUP BY v.v_ship_type
EquiJoin_Group_NumAgg_SpatialFilter_6%_SHAPE5=SELECT v.v_ship_type, COALESCE(AVG(tz.tz_avg_cog), -9999) AS avg_COG, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_SOG FROM DimVessel v, Trips t, TripZones_polygons5 tz WHERE v.v_mmsi = t.t_vessel AND tz.tz_zone_polygon && ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),0.6) AND ST_Intersects(ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),0.6), tz.tz_zone_polygon) AND t.t_trip_sk = tz.tz_trip_sk GROUP BY v.v_ship_type
