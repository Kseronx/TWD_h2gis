#----SERIE SPATIAL JOIN   
#----BATCH 1
SpatialJoin_Group_NumAgg_NoFilter_100%_SHAPE5=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz, DimSMarine m WHERE m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) GROUP BY m.m_name
SpatialJoin_Group_NumAgg_AlphaFilter_8%_SHAPE5=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz, DimSMarine m WHERE m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) AND tz.tz_entrance_time <= 20000 AND tz.tz_quit_time >= 10100 GROUP BY m.m_name
SpatialJoin_Group_NumAgg_AlphaFilter_16%_SHAPE5=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz, DimSMarine m WHERE m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) AND tz.tz_entrance_time <= 25000 AND tz.tz_quit_time >= 10100 GROUP BY m.m_name
SpatialJoin_Group_NumAgg_AlphaFilter_33%_SHAPE5=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz, DimSMarine m WHERE m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) AND tz.tz_entrance_time <= 50000 AND tz.tz_quit_time >= 10100 GROUP BY m.m_name
SpatialJoin_Group_NumAgg_SpatialFilter_6%_SHAPE5=WITH buf AS (SELECT ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326), 0.6) AS geom) SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz JOIN DimSMarine m ON m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) JOIN buf b ON tz.tz_zone_polygon && b.geom WHERE ST_Intersects(b.geom, tz.tz_zone_polygon) GROUP BY m.m_name
SpatialJoin_Group_NumAgg_SpatialFilter_18%_SHAPE5=WITH buf AS (SELECT ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326), 1.2) AS geom) SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz JOIN DimSMarine m ON m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) JOIN buf b ON tz.tz_zone_polygon && b.geom WHERE ST_Intersects(b.geom, tz.tz_zone_polygon) GROUP BY m.m_name
SpatialJoin_Group_NumAgg_SpatialFilter_36%_SHAPE5=WITH buf AS (SELECT ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326), 2) AS geom) SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tz.tz_avg_sog), -9999) AS avg_speed_knots FROM TripZones_polygons5 tz JOIN DimSMarine m ON m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) JOIN buf b ON tz.tz_zone_polygon && b.geom WHERE ST_Intersects(b.geom, tz.tz_zone_polygon) GROUP BY m.m_name

