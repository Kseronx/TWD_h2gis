SpatialJoin_NoGroup_NoAgg_SpatialFilter_6%_SHAPE5=SELECT tz_trip_sk, m_name, lon, lat FROM (SELECT tz.tz_trip_sk AS tz_trip_sk, m.m_name AS m_name, ST_X(ST_Centroid(tz.tz_zone_polygon)) AS lon, ST_Y(ST_Centroid(tz.tz_zone_polygon)) AS lat, ROW_NUMBER() OVER (PARTITION BY tz.tz_trip_sk, m.m_name ORDER BY tz.tz_trip_sk, m.m_name, tz.tz_zone_number) AS rn FROM TripZones_polygons5 tz JOIN DimSMarine m ON m.m_geom && tz.tz_zone_polygon AND ST_Intersects(m.m_geom, tz.tz_zone_polygon) WHERE tz.tz_zone_polygon && ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),0.6) AND ST_Intersects(ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),0.6), tz.tz_zone_polygon)) q WHERE rn = 1 ORDER BY tz_trip_sk, m_name
