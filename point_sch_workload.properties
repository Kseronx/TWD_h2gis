# H2GIS version generated from PostgreSQL point_sch_workload.properties
# Main translations:
# - ::geometry removed: ST_AREA(ST_EXTENT(geom)::geometry) -> ST_AREA(ST_EXTENT(geom))
# - DISTINCT ON replaced with ROW_NUMBER() OVER (...) because H2 does not support DISTINCT ON
# - TO_TIMESTAMP/EXTRACT(EPOCH) replaced with PARSEDATETIME/DATEDIFF

#----SERIE SPATIAL JOIN
#----BATCH 1  SpatialJoin_Group_NumAgg
SpatialJoin_Group_NumAgg_NoFilter_100%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) GROUP BY m.m_name
SpatialJoin_Group_NumAgg_AlphaFilter_8%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) WHERE tp.tp_time BETWEEN 10100 AND 20000 GROUP BY m.m_name
SpatialJoin_Group_NumAgg_AlphaFilter_16%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) WHERE tp.tp_time BETWEEN 10100 AND 25000 GROUP BY m.m_name
SpatialJoin_Group_NumAgg_AlphaFilter_33%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) WHERE tp.tp_time BETWEEN 10100 AND 50000 GROUP BY m.m_name
SpatialJoin_Group_NumAgg_SpatialFilter_6%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) WHERE ST_Contains(ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),0.6), tp.tp_geopoint) GROUP BY m.m_name
SpatialJoin_Group_NumAgg_SpatialFilter_18%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) WHERE ST_Contains(ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),1.2), tp.tp_geopoint) GROUP BY m.m_name
SpatialJoin_Group_NumAgg_SpatialFilter_36%_POINT=SELECT m.m_name AS marine_zone_name, COALESCE(AVG(tp.tp_sog), -9999) AS avg_speed_knots FROM TripPoints tp JOIN DimSMarine m ON ST_Contains(m.m_geom,tp.tp_geopoint) WHERE ST_Contains(ST_Buffer(ST_GeomFromText('POINT(9.972417 57.655555)', 4326),2), tp.tp_geopoint) GROUP BY m.m_name
